<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1170" viewBox="0 0 940 1170" font-family="Inter, system-ui, -apple-system, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Lending Collaboration Framework</title>
  <desc id="desc">A vertical lending workflow from Borrower to Loan Processor, Underwriter, Legal Counsel and Approval and Funding, secured at every step by Zero Trust Data Access: Verify Identity, Control Access, Monitor Activity, Maintain Audit Trail and Protect Data.</desc>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0E1A2B" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0E1A2B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer card -->
  <rect x="20" y="20" width="900" height="1130" rx="26" fill="#ffffff" stroke="#E5E9EE" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Header -->
  <text x="70" y="86" fill="#e8590a" font-size="15" font-weight="700" letter-spacing="2.5">LENDING WORKFLOW</text>
  <text x="70" y="124" fill="#0E1A2B" font-size="34" font-weight="700">Lending Collaboration Framework</text>
  <text x="70" y="154" fill="#51606F" font-size="16" font-weight="400">How a loan moves through every party &#8212; secured end to end.</text>

  <!-- ============ WORKFLOW STAGES ============ -->
  <!-- Stage 1: Borrower -->
  <g filter="url(#softShadow)">
    <rect x="240" y="190" width="460" height="64" rx="14" fill="#ffffff" stroke="#E5E9EE" stroke-width="1.5"/>
  </g>
  <circle cx="286" cy="222" r="19" fill="#e8590a"/>
  <text x="286" y="222" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="322" y="222" fill="#0E1A2B" font-size="20" font-weight="600" dominant-baseline="central">Borrower</text>

  <!-- arrow 1->2 -->
  <line x1="470" y1="258" x2="470" y2="276" stroke="#b8c2ce" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="470,285 463,274 477,274" fill="#b8c2ce"/>

  <!-- Stage 2: Loan Processor -->
  <g filter="url(#softShadow)">
    <rect x="240" y="288" width="460" height="64" rx="14" fill="#ffffff" stroke="#E5E9EE" stroke-width="1.5"/>
  </g>
  <circle cx="286" cy="320" r="19" fill="#e8590a"/>
  <text x="286" y="320" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="322" y="320" fill="#0E1A2B" font-size="20" font-weight="600" dominant-baseline="central">Loan Processor</text>

  <!-- arrow 2->3 -->
  <line x1="470" y1="356" x2="470" y2="374" stroke="#b8c2ce" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="470,383 463,372 477,372" fill="#b8c2ce"/>

  <!-- Stage 3: Underwriter -->
  <g filter="url(#softShadow)">
    <rect x="240" y="386" width="460" height="64" rx="14" fill="#ffffff" stroke="#E5E9EE" stroke-width="1.5"/>
  </g>
  <circle cx="286" cy="418" r="19" fill="#e8590a"/>
  <text x="286" y="418" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="322" y="418" fill="#0E1A2B" font-size="20" font-weight="600" dominant-baseline="central">Underwriter</text>

  <!-- arrow 3->4 -->
  <line x1="470" y1="454" x2="470" y2="472" stroke="#b8c2ce" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="470,481 463,470 477,470" fill="#b8c2ce"/>

  <!-- Stage 4: Legal Counsel -->
  <g filter="url(#softShadow)">
    <rect x="240" y="484" width="460" height="64" rx="14" fill="#ffffff" stroke="#E5E9EE" stroke-width="1.5"/>
  </g>
  <circle cx="286" cy="516" r="19" fill="#e8590a"/>
  <text x="286" y="516" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="322" y="516" fill="#0E1A2B" font-size="20" font-weight="600" dominant-baseline="central">Legal Counsel</text>

  <!-- arrow 4->5 -->
  <line x1="470" y1="552" x2="470" y2="570" stroke="#b8c2ce" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="470,579 463,568 477,568" fill="#b8c2ce"/>

  <!-- Stage 5: Approval & Funding (goal / accent) -->
  <g filter="url(#softShadow)">
    <rect x="240" y="582" width="460" height="64" rx="14" fill="#0E1A2B"/>
  </g>
  <circle cx="286" cy="614" r="19" fill="#e8590a"/>
  <text x="286" y="614" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="322" y="614" fill="#ffffff" font-size="20" font-weight="700" dominant-baseline="central">Approval &amp; Funding</text>

  <!-- connector into security band -->
  <line x1="470" y1="656" x2="470" y2="696" stroke="#e8590a" stroke-width="3" stroke-linecap="round"/>
  <polygon points="470,708 461,694 479,694" fill="#e8590a"/>

  <!-- ============ ZERO TRUST DATA ACCESS BAND ============ -->
  <rect x="40" y="724" width="860" height="406" rx="20" fill="#0E1A2B"/>

  <text x="470" y="780" fill="#e8590a" font-size="14" font-weight="700" letter-spacing="2.5" text-anchor="middle">SECURITY FRAMEWORK</text>
  <text x="470" y="814" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">Zero Trust Data Access</text>
  <text x="470" y="846" fill="#aab3bf" font-size="15" font-weight="400" text-anchor="middle">Five controls applied at every step above</text>

  <!-- 5 principle columns. centers: 158, 314, 470, 626, 782 ; icon cy=960 -->
  <!-- 1 Verify Identity (user) -->
  <circle cx="158" cy="960" r="31" fill="#e8590a" fill-opacity="0.10" stroke="#e8590a" stroke-width="2"/>
  <g transform="translate(158,960)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-7" r="6.5"/>
    <path d="M-12,14 C-12,2 12,2 12,14"/>
  </g>
  <text x="158" y="1024" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Verify</text>
  <text x="158" y="1044" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Identity</text>

  <!-- 2 Control Access (lock) -->
  <circle cx="314" cy="960" r="31" fill="#e8590a" fill-opacity="0.10" stroke="#e8590a" stroke-width="2"/>
  <g transform="translate(314,960)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-10" y="-2" width="20" height="16" rx="3"/>
    <path d="M-6,-2 V-7 a6,6 0 0,1 12,0 V-2"/>
    <circle cx="0" cy="6" r="1.6" fill="#ffffff" stroke="none"/>
  </g>
  <text x="314" y="1024" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Control</text>
  <text x="314" y="1044" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Access</text>

  <!-- 3 Monitor Activity (eye) -->
  <circle cx="470" cy="960" r="31" fill="#e8590a" fill-opacity="0.10" stroke="#e8590a" stroke-width="2"/>
  <g transform="translate(470,960)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-13,0 Q0,-10 13,0 Q0,10 -13,0 Z"/>
    <circle cx="0" cy="0" r="3.6" fill="#ffffff" stroke="none"/>
  </g>
  <text x="470" y="1024" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Monitor</text>
  <text x="470" y="1044" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Activity</text>

  <!-- 4 Maintain Audit Trail (document) -->
  <circle cx="626" cy="960" r="31" fill="#e8590a" fill-opacity="0.10" stroke="#e8590a" stroke-width="2"/>
  <g transform="translate(626,960)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-9" y="-13" width="18" height="26" rx="2.5"/>
    <path d="M-4,-6 H4 M-4,-1 H4 M-4,4 H1"/>
  </g>
  <text x="626" y="1024" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Maintain</text>
  <text x="626" y="1044" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Audit Trail</text>

  <!-- 5 Protect Data (shield) -->
  <circle cx="782" cy="960" r="31" fill="#e8590a" fill-opacity="0.10" stroke="#e8590a" stroke-width="2"/>
  <g transform="translate(782,960)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-14 L11,-9 V1 C11,8 6,12.5 0,15 C-6,12.5 -11,8 -11,1 V-9 Z"/>
    <path d="M-5,-1 L-1,4 L6,-5"/>
  </g>
  <text x="782" y="1024" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Protect</text>
  <text x="782" y="1044" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Data</text>
</svg>
